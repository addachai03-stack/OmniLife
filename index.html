<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OmniLife AI</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#000;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
color:white;
}

.container{
text-align:center;
}

.orb{
width:190px;
height:190px;
border-radius:50%;
margin:auto;
background:radial-gradient(circle,#8bd3ff,#3b82f6,#001633);
box-shadow:
0 0 40px #3b82f6,
0 0 80px #2563eb,
0 0 140px #1d4ed8;
animation:pulse 3s infinite ease-in-out;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.15);}
100%{transform:scale(1);}
}

h1{
margin-top:35px;
font-size:42px;
letter-spacing:2px;
opacity:0;
animation:fade 2s forwards;
animation-delay:1s;
}

p{
margin-top:10px;
font-size:18px;
color:#9ec9ff;
opacity:0;
animation:fade 2s forwards;
animation-delay:2s;
}

button{
margin-top:40px;
padding:15px 40px;
border:none;
border-radius:40px;
background:#2563eb;
color:white;
font-size:18px;
cursor:pointer;
transition:.3s;
box-shadow:0 0 25px #2563eb;
opacity:0;
animation:fade 2s forwards;
animation-delay:3s;
}

button:hover{
transform:scale(1.08);
}

@keyframes fade{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}
</style>

</head>

<body>

<div class="container">

<div class="orb"></div>

<h1 id="title">Hello 👋</h1>

<p id="text">Initializing AI...</p>

<button onclick="startAI()">Tap To Begin</button>

</div>

<script>

setTimeout(()=>{
document.getElementById("title").innerHTML="I'm Omni";
document.getElementById("text").innerHTML="Your Personal AI Life OS";
},2500);

function startAI(){
alert("Welcome to OmniLife 🚀");
}

</script>

</body>
</html>
