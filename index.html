<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OmniLife</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.container{
text-align:center;
}

.orb{
width:180px;
height:180px;
border-radius:50%;
margin:auto;
background:radial-gradient(circle,#7dd3fc,#2563eb,#020617);
box-shadow:
0 0 30px #38bdf8,
0 0 60px #2563eb,
0 0 100px #1d4ed8;
animation:pulse 2.5s infinite;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.12);}
100%{transform:scale(1);}
}

h1{
color:white;
margin-top:40px;
font-size:40px;
letter-spacing:3px;
}

p{
margin-top:10px;
color:#8ab4ff;
font-size:18px;
}
</style>
</head>

<body>

<div class="container">
<div class="orb"></div>
<h1>OmniLife</h1>
<p>Your Personal AI Life OS</p>
</div>

</body>
</html>
