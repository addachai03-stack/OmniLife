name: Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [ tapstorm-starter ]
    paths: [ "android/**", ".github/workflows/android-debug.yml" ]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Locate Android SDK and install packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK root: $SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -print -quit 2>/dev/null)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT"
            find /usr/local/lib/android -maxdepth 5 -type f -name sdkmanager -print 2>/dev/null || true
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle -p android assembleDebug
      - name: Re-sign APK with V1 and V2 compatibility
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"
          KEYSTORE="$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkeypair -v -keystore "$KEYSTORE" -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --min-sdk-version 23 --v1-signing-enabled true --v2-signing-enabled true \
            --out "$APK.resigned" "$APK"
          mv "$APK.resigned" "$APK"
      - name: Verify APK signatures, alignment and package metadata
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          TOOLS="$SDK_ROOT/build-tools/35.0.0"
          test -s "$APK"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apk-signature-check.txt
          grep -q "Verified using v1 scheme (JAR signing): true" /tmp/apk-signature-check.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/apk-signature-check.txt
          "$TOOLS/zipalign" -c -v 4 "$APK"
          "$TOOLS/aapt" dump badging "$APK" | head -n 8
      - uses: actions/upload-artifact@v4
        with:
          name: TAPSTORM-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
