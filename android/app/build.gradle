plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.tapstorm.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.tapstorm.app'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }
    // Both v1 and v2 are explicitly enabled for OEM installer compatibility.
    signingConfigs {
        debug {
            enableV1Signing true
            enableV2Signing true
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}