plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.tapstorm.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.tapstorm.app'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
    }
    signingConfigs {
        debug {
            enableV1Signing true
            enableV2Signing true
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}