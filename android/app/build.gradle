plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.tapstorm.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tapstorm.app'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.6.0'
    }

    signingConfigs {
        debug {
            enableV1Signing true
            enableV2Signing true
        }
        release {
            // The keystore is supplied only by GitHub Actions secrets at build time.
            // Never commit the keystore or passwords to the repository.
            storeFile file(System.getenv("TAPSTORM_RELEASE_STORE_FILE") ?: "release-key-not-configured.jks")
            storePassword System.getenv("TAPSTORM_KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("TAPSTORM_KEY_ALIAS") ?: ""
            keyPassword System.getenv("TAPSTORM_KEY_PASSWORD") ?: ""
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
